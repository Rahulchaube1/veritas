[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-evidence"
version = "0.1.0"
description = "Local, provenance-aware evidence retrieval and claim verification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name="Rahul Chaube"}]
dependencies = ["numpy>=1.26,<3","scipy>=1.11,<2","scikit-learn>=1.4,<2","fastapi>=0.115,<1","uvicorn>=0.30,<1","pydantic>=2.8,<3","PyYAML>=6,<7"]
[project.optional-dependencies]
neural = ["tokenizers>=0.20,<1","onnxruntime>=1.19,<2","faiss-cpu>=1.9,<2"]
dev = ["pytest>=8","pytest-cov>=5","httpx>=0.27","ruff","mypy","build"]
[project.scripts]
veritas = "veritas.cli:main"
[tool.setuptools.package-data]
veritas = ["web/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff.lint]
select=["E4","E7","E9","F","I"]

[tool.ruff]
line-length = 110
[tool.mypy]
plugins=["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
